# ==============================================================================
# Exp-2c: PanDerm Fine-Tuning Control Arm (ViT-Base, Uniform Shuffling) - Local
# ==============================================================================

experiment:
  name: "exp2c-panderm-uniform"
  description: "PanDerm ViT fine-tuning control arm with uniform random shuffling (dermoscopic modality)"
  seed: 42

data:
  splits_file: "data/splits/lesion_level_splits.csv"
  image_dir: "data/images"
  label_mapping: "configs/label_mapping.json"
  image_size: 224
  modality: "dermoscopic"

dataloader:
  num_workers: 0
  weighted_sampler: false

model:
  name: "panderm_base"
  pipeline_type: "panderm"
  pretrained: true
  checkpoint_path: "checkpoints/panderm_base.pth"

training:
  epochs: 30
  batch_size: 32
  gradient_accumulation_steps: 1
  clip_grad: 1.0
  warmup_epochs: 5
  monitor: "val_macro_f1"

optimizer:
  name: "adamw"
  lr: 2.5e-4
  weight_decay: 0.05
  layer_decay: 0.9
  warmup_epochs: 5
  min_lr: 1.0e-6

loss:
  name: "label_smoothing"
  label_smoothing: 0.1

wandb:
  project: "SkinCancerTracker"
  offline: true

output:
  checkpoint_dir: "checkpoints/exp2c_panderm_uniform"
  results_dir: "results/exp2c_panderm_uniform"
  max_keep: 2
