# ==============================================================================
# Exp-3b: PanDerm Fine-Tuning with Train-Time Logit Adjustment (ViT-Base) - Local
# Reference: Menon et al., "Long-Tail Learning via Logit Adjustment", ICLR 2021
# ==============================================================================

experiment:
  name: "exp3b-panderm-logit-adj"
  description: "PanDerm ViT-Base fine-tuning with Train-Time Logit Adjustment (local config)"
  seed: 42

data:
  splits_file: "data/splits/lesion_level_splits.csv"
  image_dir: "data/images"
  label_mapping: "configs/label_mapping.json"
  image_size: 224
  modality: "dermoscopic"

dataloader:
  num_workers: 0
  weighted_sampler: false

model:
  name: "panderm_base"
  pipeline_type: "panderm"
  pretrained: true
  checkpoint_path: "checkpoints/panderm_base.pth"

training:
  epochs: 30
  batch_size: 32
  clip_grad: 1.0
  warmup_epochs: 5
  monitor: "val_macro_f1"

optimizer:
  name: "adamw"
  lr: 2.5e-4
  weight_decay: 0.05
  layer_decay: 0.9
  warmup_epochs: 5
  min_lr: 1.0e-6

loss:
  name: "logit_adjusted"
  tau: 1.0
  label_smoothing: 0.1

wandb:
  project: "SkinCancerTracker"
  offline: true

output:
  checkpoint_dir: "checkpoints/exp3b_panderm_logit_adj"
  results_dir: "results/exp3b_panderm_logit_adj"
